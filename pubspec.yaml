name: pepper_clinical
description: "Pepper Clinical Infinity V6 — AI Autism Therapy"
version: 6.0.0+1
# © 2026 Lamya Fadlulmola Hamed Ali

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Navigation
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0

  # HTTP — connects to Cython backend
  http: ^1.2.1

  # Camera + AI
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_pose_detection: ^0.14.1

  # TTS Arabic + English
  flutter_tts: ^4.0.2

  # Speech
  speech_to_text: ^7.4.0

  # Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  confetti: ^0.8.0

  # Storage
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^10.3.1

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.0

  # Charts
  fl_chart: ^1.2.0

  # Device
  device_info_plus: ^13.1.0
  permission_handler: ^12.0.3
  wakelock_plus: ^1.2.5

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  logger: ^2.4.0
  tflite_flutter: ^0.12.1

  sqflite: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/sounds/
    - assets/models/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
